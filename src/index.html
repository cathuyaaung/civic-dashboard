<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ward 11 Civic Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply a saved theme before first paint to avoid a flash of the wrong
      // theme. Same storage key as ThemeService (src/app/core/theme.ts).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
